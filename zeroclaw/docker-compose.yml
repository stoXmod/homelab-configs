version: "3.8"

services:
  zeroclaw:
    build: .
    container_name: zeroclaw
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./data:/root/.zeroclaw/workspace
      - ./config.toml:/root/.zeroclaw/config.toml
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "zeroclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 3